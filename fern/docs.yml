# fern docs configuration
# - content lives under docs/ (copied from web-api-docs-zh and web-api-zh)
# - regenerate this file: node scripts/generate-docs-yml.mjs

title: IBKR Web API 文档

logo:
  href: /
  light: assets/logo-light.svg
  dark: assets/logo-dark.svg
  height: 28

navbar-links:
  - type: outlined
    text: IBKR 官网
    href: https://www.interactivebrokers.com
  - type: filled
    text: 问题反馈
    href: mailto:API-Feedback@interactivebrokers.com

colors:
  accent-primary:
    light: "#1e40af"
    dark: "#60a5fa"

layout:
  searchbar-placement: header

tabs:
  introduction:
    display-name: "简介"
    slug: "introduction"
  authentication:
    display-name: "身份验证"
    slug: "authentication"
  account-management:
    display-name: "账户管理"
    slug: "account-management"
  trading:
    display-name: "交易"
    slug: "trading"
  api-reference:
    display-name: "API 参考"
    slug: "api-reference"
  v1:
    display-name: "Web API v1.0 文档"
    slug: "v1"
  flex-web-service:
    display-name: "Flex Web Service"
    slug: "flex-web-service"
  changelog:
    display-name: "更新日志"
    slug: "changelog"

instances:
  - url: "web-api-zh.docs.buildwithfern.com"

theme:
  tabs:
    placement: header
    style: default
    alignment: left
  footer-nav: minimal

redirects:
  - source: /welcome
    destination: /introduction
  - source: /customization
    destination: /introduction
  - source: /navigation
    destination: /introduction
  - source: /editing-your-docs
    destination: /introduction
  - source: /support
    destination: /introduction
  - source: /writing-content
    destination: /introduction

