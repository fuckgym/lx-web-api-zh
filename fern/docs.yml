# fern docs configuration
# - content lives under docs/ (copied from web-api-docs-zh and web-api-zh)
# - regenerate this file: node scripts/generate-docs-yml.mjs

title: IBKR Web API 文档

logo:
  href: /
  light: assets/logo-light.svg
  dark: assets/logo-dark.svg
  height: 28

announcement:
  message: "IBKR Web API 中文文档 — 覆盖账户管理、交易、身份验证、API Reference 与 Flex Web Service"

navbar-links:
  - type: outlined
    text: IBKR 官网
    href: https://www.interactivebrokers.com
  - type: filled
    text: 问题反馈
    href: mailto:API-Feedback@interactivebrokers.com

colors:
  accent-primary:
    light: "#1e40af"
    dark: "#60a5fa"

layout:
  searchbar-placement: header

tabs:
  introduction:
    display-name: "Introduction"
    slug: "introduction"
  authentication:
    display-name: "Authentication"
    slug: "authentication"
  account-management:
    display-name: "Account Management"
    slug: "account-management"
  trading:
    display-name: "Trading"
    slug: "trading"
  api-reference:
    display-name: "API Reference"
    slug: "api-reference"
  v1:
    display-name: "Web API v1.0 Documentation"
    slug: "v1"
  flex-web-service:
    display-name: "Flex Web Service"
    slug: "flex-web-service"
  changelog:
    display-name: "Changelog"
    slug: "changelog"

instances:
  - url: "web-api-zh.docs.buildwithfern.com"

theme:
  tabs:
    placement: header
    style: default
    alignment: left
  footer-nav: minimal

redirects:
  - source: /welcome
    destination: /introduction
  - source: /customization
    destination: /introduction
  - source: /navigation
    destination: /introduction
  - source: /editing-your-docs
    destination: /introduction
  - source: /support
    destination: /introduction
  - source: /writing-content
    destination: /introduction

