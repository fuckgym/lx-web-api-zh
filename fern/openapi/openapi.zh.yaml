        **请求体** — 一个单独的 RS256 签名 JWT（有效期：1 分钟），其载荷包含请求声明（`userName`、`requestId`、`payload`，以及可选的 `isEmpTrack`）。`requestId` 必须与之前成功的 `/csv/v2/verify` 调用相匹配。


        在正文 JWT 载荷被解析之前发生的失败（令牌未激活、载荷缺失）会返回 `success: false`，且不带 `requestId` 字段。<br><br>**权限范围**: `restrictions.write`<br>**安全策略**: `Signed JWT`'
      tags:
      - 交易前合规限制
      parameters:
      - name: Authorization
        in: header
        description: RS256 签名的 JWT（Bearer 格式），使用您注册的私钥签名。必须包含用于标识主账户的 `accountId` 声明。与请求体中的 JWT 相互独立，且是额外要求的。
        required: true
        schema:
          type: string
      responses:
