    V1APIiServer问题屏蔽Post请求体ContentApplicationJsonSchema消息ID项:
      type: string
      enum:
      - o163
      - o354
      - o382
      - o383
      - o403
      - o451
      - o2136
      - o2137
      - o2165
      - o10082
      - o10138
      - o10151
      - o10152
      - o10153
      - o10164
      - o10223
      - o10288
      - o10331
      - o10332
      - o10333
      - o10334
      - o10335
      - o10336
      - p6
      - p12
      description: "需要预先批准的警告消息。\n  * `o163` - 以下订单超出价格百分比限制\n  * `o354` - “您正在提交一笔没有行情数据的订单。我们强烈建议不要这样做，因为这可能导致错误且意外的交易。您确定要提交此订单吗？”\n  * `o382` - 以下数值超出最小价格变动单位（tick size）限制\n  * `o383` - “以下订单 \\\"\"BUY 650 AAPL NASDAQ.NMS\\\"\" 的数量超出 500 的数量上限。\\n您确定要提交此订单吗？”\n  * `o403` - “此订单很可能立即触发并成交。\\n您确定要提交此订单吗？”\n  * `o451` - “以下订单 \\\"\"BUY 650 AAPL NASDAQ.NMS\\\"\" 的预估价值 124,995.00 USD 已超出 \\n100,000 USD 的总价值上限。\\n您确定要提交此订单吗？”\n  * `o2136` - 混合分配订单警告\n  * `o2137` - 交叉方向订单警告\n  * `o2165` - 警告标的在常规交易时段之外不支持碎股交易\n  * `o10082` - 已赎回债券警告\n  * `o10138` - 以下订单的数量修改超出数量修改上限。\n  * `o10151` - 警告市价单的风险\n  * `o10152` - 警告止损订单一旦生效后的相关风险\n  * `o10153` - <h4>确认强制价格上限</h4>为避免以不符合公平有序市场的价格进行交易，IB 可能设置上限（针对买入订单）或卖出订单）。这可能导致原本可成交的订单无法成交。\n  * `o10164` - “交易者有责任理解现金数量细节，相关信息仅按尽力而为原则提供。”\n  * `o10223` - “<h4>现金数量订单确认</h4>以货币金额（现金数量）表示数量的订单按非保证基础提供。系统通过在指定金额已支出（对于买单）或已收足（对于卖单）时撤销订单来模拟该订单。除货币金额外，订单还使用根据现金数量估算因子计算出的最大数量，您可在 Presets 中修改该因子。”\n  * `o10288` - 警告加密货币市价单的相关风险\n  * `o10331` - “您即将提交止损订单。请了解可用的各类止损订单类型及各自的相关风险。\\n您确定要提交此订单吗？”\n  * `o10332` - OSL Digital Securities LTD 加密货币订单警告\n  * `o10333` - 期权平值行权警告\n  * `o10334` - 警告订单将被下至当前综合账户而非当前选定的全球账户。\n  * `o10335` - 用于内部 Rapid Entry 窗口。\n  * `o10336` - 该证券流动性有限。如果您选择交易该证券，则存在更高的风险：您可能无法在希望的时间、以希望的价格和/或在无亏损的情况下平仓。请确认您理解交易流动性不足证券的风险。\n  * `您确定要提交此订单吗？\n  * `p6` - 此订单将被分配至多个账户。我们强烈建议您在提交订单前先熟悉我们的分配功能。\n  * `p12` - “如果您的订单无法立即执行，我们的系统可能视市场状况，在限价超出距当时参考价格的允许距离时拒绝该订单。如果发生这种情况，您将不会得到成交。此项控制旨在确保我们履行避免向市场提交扰乱性订单的监管义务。\\\\n是否使用 Price Management Algo？”\n"
      title: V1APIiServer问题屏蔽Post请求体ContentApplicationJsonSchema消息ID项
