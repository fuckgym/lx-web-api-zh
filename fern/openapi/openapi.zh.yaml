openapi: 3.1.0
info:
  title: API 参考
  version: 1.0.0
paths:
  /v1/api/oauth/request_token:
    post:
      operationId: tradingOAuth10A_reqTempToken
      summary: 获取请求令牌
      description: 作为第三方请求临时令牌，以开启 OAuth 1.0a 授权工作流程。
      tags:
      - OAuth 1.0a 授权
      parameters:
      - name: Authorization
        in: header
        description: 请求 /request_token 端点时使用的 OAuth 1.0a 授权请求头。
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 包含临时 OAuth 访问令牌的成功响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/交易OAuth10a_请求临时令牌_响应_200'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /v1/api/oauth/access_token:
    post:
      operationId: tradingOAuth10A_reqAccessToken
      summary: 生成访问令牌
      description: 为已向该消费者授予授权的 IB 用户名请求访问令牌。
      tags:
      - OAuth 1.0a 授权
      parameters:
      - name: Authorization
        in: header
        description: 请求 /access_token 端点时使用的 OAuth 1.0a 授权请求头。
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 包含永久 OAuth 访问令牌的成功响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/交易OAuth10a_请求访问令牌_响应_200'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /v1/api/oauth/live_session_token:
    post:
      operationId: tradingOAuth10A_reqLiveSessionToken
      summary: 生成实时会话令牌
      description: 生成实时会话令牌共享密钥并获得 Web API 访问权限。
      tags:
      - OAuth 1.0a 授权
      parameters:
      - name: Authorization
        in: header
        description: 请求 /live_session_token 端点时使用的 OAuth 1.0a 授权请求头。
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 包含 Diffie-Hellman 挑战与签名值的成功响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/交易OAuth10a_请求实时会话令牌_响应_200'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /gw/api/v1/sso-browser-sessions:
    post:
      operationId: authorizationSsoBrowserSessions_createSsoBrowserSessions
      summary: 创建 SSO 浏览器会话。
      description: '<br>**权限范围**: `sso-browser-sessions.write`<br>**安全策略**: `Signed JWT`'
      tags:
      - SSO 浏览器会话
      parameters:
      - name: authorization
        in: header
        description: 指定授权请求头的值（例如 Bearer eyJ0eXAiOiJKV1...）。
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 创建单一登录（SSO）以访问 IBKR 托管的门户（白标）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/创建浏览器会话响应'
        '400':
          description: 返回表示错误请求的 Problem detail 实例。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/缺少必需参数响应'
        '401':
          description: 返回表示未授权请求的 Problem detail 实例。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/无效访问令牌响应'
        '403':
          description: 返回表示被禁止请求的 Problem detail 实例。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/权限范围不足响应'
        '500':
          description: 返回表示内部服务器错误的 Problem detail 实例。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/服务器内部错误响应'
      requestBody:
        description: 代表最终用户创建浏览器会话。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/创建浏览器会话请求'
      security:
      - oauth2Bearer: []
  /gw/api/v1/sso-sessions:
    post:
      operationId: authorizationSsoSessions_createSsoSessions
      summary: 代表最终用户创建新的 SSO 会话。
      description: '<br>**权限范围**: `sso-sessions.write`<br>**安全策略**: `Signed JWT`'
      tags:
      - SSO 会话
      parameters:
      - name: authorization
        in: header
        description: 指定授权请求头的值（例如 Bearer eyJ0eXAiOiJKV1...）。
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 返回包含对新建 SSO 会话的引用的 JSON 对象。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/创建会话响应'
        '400':
          description: 返回表示错误请求的 Problem detail 实例。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/缺少必需参数响应'
        '401':
          description: 返回表示未授权请求的 Problem detail 实例。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/无效访问令牌响应'
        '403':
          description: 返回表示被禁止请求的 Problem detail 实例。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/权限范围不足响应'
        '500':
          description: 返回表示内部服务器错误的 Problem detail 实例。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/服务器内部错误响应'
      requestBody:
        description: 代表最终用户创建会话。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/创建会话请求'
      security:
      - oauth2Bearer: []
  /oauth2/api/v1/token:
    post:
      operationId: authorizationToken_generateToken
      summary: 创建访问令牌
      description: 基于请求参数生成 OAuth 2.0 访问令牌。
      tags:
      - 授权令牌
      responses:
        '200':
          description: 返回令牌响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/令牌响应'
        '400':
          description: 返回表示错误请求的 [Problem detail](https://datatracker.ietf.org/doc/html/rfc9457) 实例。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/问题详情响应'
        '500':
          description: 返回表示服务器内部错误的 [Problem detail](https://datatracker.ietf.org/doc/html/rfc9457) 实例。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/问题详情响应'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/令牌请求'
      security:
      - ssoBearer: []
  /v1/api/iserver/account/pnl/partitioned:
    get:
      operationId: tradingAccounts_getPnl
      summary: 账户盈亏
      description: '返回所选账户的最新盈亏值。首次请求将在 upnl 对象中返回空数组。

        '
      tags:
      - 交易账户
      responses:
        '200':
          description: 指 “updated PnL”（已更新盈亏）。持有一个由键值对组成的盈亏明细 JSON 对象。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/盈亏分区响应'
        '400':
          description: 错误请求；传入的输入无法通过初始校验，并被立即检测出来
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /v1/api/acesws/{accountId}/signatures-and-owners:
    get:
      operationId: tradingAccounts_getAccountOwners
      summary: 列出账户签约人与所有者
      description: 获取账户上所有申请人姓名的列表，以及各自所代表的账户和实体。
      tags:
      - 交易账户
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 一个包含有效账户以及交易访问相关账户属性的对象。此端点也用于确认账户验证。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/签名与所有者'
        '400':
          description: 错误请求；accountId 为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /v1/api/iserver/accounts:
    get:
      operationId: tradingAccounts_getBrokerageAccounts
      summary: 列出所有可交易账户
      description: 返回用户拥有交易权限的账户列表、各账户的别名以及当前选定的账户。注意：在修改订单或查询未结订单之前，必须调用此端点。
      tags:
      - 交易账户
      responses:
        '200':
          description: 一个包含有效账户以及交易访问相关账户属性的对象。此端点也用于确认账户验证。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/用户账户响应'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /v1/api/iserver/account/search/{searchPattern}:
    get:
      operationId: tradingAccounts_getDynamicAccounts
      summary: 搜索动态账户
      description: '返回与请求中设置的查询模式匹配的账户列表。配置了 DYNACCT 属性的经纪账户在登录时不会收到账户信息，而是必须动态查询并设置其账户号码。未配置 DYNACCT 属性的客户将收到 503 错误。

        '
      tags:
      - 交易账户
      parameters:
      - name: searchPattern
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 返回与 searchPattern 字符串匹配的所有账户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/动态账户搜索响应'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /v1/api/iserver/dynaccount:
    post:
      operationId: tradingAccounts_setDynamicAccount
      summary: 设置活动动态账户
      description: 设置活动的动态账户。
      tags:
      - 交易账户
      responses:
        '200':
          description: 详述合约信息的对象数组。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/设置账户响应'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '500':
          description: '内部服务器错误，在传入请求无法处理时返回。有时可能包含部分错误请求的情形。例如，传入了错误的 accountId，而只能在处理请求的后期才检测出来。错误中包含问题的原因。

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/仅错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acctId:
                  type: string
                  description: 应为后续请求设置的账户 ID。
              required:
              - acctId
      security:
      - ssoBearer: []
  /v1/api/iserver/account/{accountId}/summary/balances:
    get:
      operationId: tradingAccounts_getBalanceSummary
      summary: 账户余额汇总
      description: 返回账户权益和现金余额的汇总，包括总计以及按账户分部细分的数据。
      tags:
      - 交易账户
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 表示成功返回可用资金。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/账户余额汇总响应'
        '400':
          description: 错误请求；传入的输入无法通过初始校验，并被立即检测出来
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /v1/api/iserver/account/{accountId}/summary/margins:
    get:
      operationId: tradingAccounts_getMarginSummary
      summary: 账户保证金使用汇总
      description: 返回账户保证金的汇总，包括总计以及按账户分部细分的数据。
      tags:
      - 交易账户
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 表示获取保证金余额值的请求成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/账户保证金汇总响应'
        '400':
          description: 错误请求；传入的输入无法通过初始校验，并被立即检测出来
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /v1/api/iserver/account/{accountId}/summary/market_value:
    get:
      operationId: tradingAccounts_getAccountMarketSummary
      summary: 账户市值汇总
      description: 按货币和资产类别返回账户市值的汇总。
      tags:
      - 交易账户
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 表示市值请求成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/汇总市值响应'
        '400':
          description: 错误请求；传入的输入无法通过初始校验，并被立即检测出来
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /v1/api/iserver/account/{accountId}/summary:
    get:
      operationId: tradingAccounts_getAccountSummary
      summary: 账户价值汇总
      description: 提供账户详情的总体概览，例如余额数值。
      tags:
      - 交易账户
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 提供账户详情的总体概览，例如余额数值。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/账户汇总响应'
        '400':
          description: 错误请求；传入的输入无法通过初始校验，并被立即检测出来
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      security:
      - ssoBearer: []
  /v1/api/iserver/account/{accountId}/summary/available_funds:
    get:
      operationId: tradingAccounts_getFundSummary
      summary: 可用资金汇总
      description: 提供专门针对可用资金的汇总，比标准的 /summary 端点更为深入。
      tags:
      - 交易账户
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 表示成功返回可用资金。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/可用资金响应'
        '400':
          description: 错误请求；传入的输入无法通过初始校验，并被立即检测出来
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
