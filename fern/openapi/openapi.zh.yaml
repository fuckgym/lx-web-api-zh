    交易行情数据_获取行情历史_响应_200:
      oneOf:
      - $ref: '#/components/schemas/iServer历史买卖价响应'
      - $ref: '#/components/schemas/iServer历史最新价响应'
      - $ref: '#/components/schemas/iServer历史中间价响应'
      title: 交易行情数据_获取行情历史_响应_200
    行情字段:
      type: string
      description: "行情数据字段，将 tick id 枚举到其各自的值。可提供以逗号分隔的一系列字段。一次最多可指定 50 个字段。\n  * `31` - 最新价。合约最后成交的价格。可能包含以下前缀之一：C - 前一交易日收盘价。H - 交易已暂停。\n  * `55` - 代码。 \n  * `58` - 文本。 \n  * `70` - 最高价。当日最高价\n  * `71` - 最低价。当日最低价\n  * `73` - 市值。您在该证券中持仓的当前市值。市值使用实时行情数据计算（即使未订阅行情数据）。\n  * `74` - 平均价。持仓的平均价格。\n  * `75` - 未实现盈亏。未实现的盈利或亏损。未实现盈亏使用实时行情数据计算（即使未订阅行情数据）。\n  * `76` - 格式化持仓。 \n  * `77` - 格式化未实现盈亏。 \n  * `78` - 日盈亏。自前一收盘以来当日的盈利或亏损。日盈亏使用实时行情数据计算（即使未订阅行情数据）。\n  * `79` - 已实现盈亏。已实现的盈利或亏损。已实现盈亏使用实时行情数据计算（即使未订阅行情数据）。\n  * `80` - 未实现盈亏 %。以百分比表示的未实现盈利或亏损。\n  * `82` - 涨跌。最新价与前一交易日收盘价之差\n  * `83` - 涨跌 %。最新价与前一交易日收盘价之差的百分比。\n  * `84` - 买入价。该合约的最高买入报价。\n  * `85` - 卖出量。以卖出价挂出的合约或股票数量。对于美股\n  * `86` - 卖出价。该合约的最低卖出报价。\n  * `87` - 成交量。当日成交量\n  * `88` - 买入量。以买入价申报的合约或股票数量。对于美股\n  * `201` - 权利。声明期权的权利类型，Call 或 Put。\n  * `6004` - 交易所。 \n  * `6008` - Conid。来自 IBKR 数据库的合约标识符。\n  * `6070` - SecType。标的的资产类别。\n  * `6072` - 月份。 \n  * `6073` - 常规到期日。 \n  * `6119` - 行情数据传输方式的标记（类似于请求 ID）。 \n  * `6457` - 标的 Conid。使用 /trsrv/secdef 获取有关该证券的更多信息。 \n  * `6508` - 服务参数.. \n  * `6509` - 行情数据可用性。该字段可能包含三个字符。第一个字符定义：R = 实时，D = 延迟，Z = 冻结，Y = 延迟冻结，N = 未订阅，i - 不完整，v - VDR 豁免（Vendor Display Rule 603c）。第二个字符定义：P = 快照，p = 合并。第三个字符定义：B = 盘口。实时数据实时无延迟回传，需要行情数据订阅。延迟 - 数据延迟 15-20 分钟回传。冻结 - 市场收盘时最后记录的数据。  实时回传。延迟冻结 - 市场收盘时最后记录的数据，延迟回传。未订阅 - 用户不具备回传实时或延迟数据所需的行情数据订阅。快照 - 该合约可进行快照请求。合并 - 行情数据聚合自多个交易所或交易场所。盘口 - 该合约可提供盘口最优档数据。\n  * `7051` - 公司名称。 \n  * `7057` - 卖出交易所。显示提供 SMART 价格的交易所。A=AMEX, C=CBOE, I=ISE, X=PHLX, N=PSE, B=BOX, Q=NASDAQOM, Z=BATS, W=CBOE2, T=NASDAQBX, M=MIAX, H=GEMINI, E=EDGX, J=MERCURY\n  * `7058` - 最新成交交易所。显示提供 SMART 价格的交易所。A=AMEX, C=CBOE, I=ISE, X=PHLX, N=PSE, B=BOX, Q=NASDAQOM, Z=BATS, W=CBOE2, T=NASDAQBX, M=MIAX, H=GEMINI, E=EDGX, J=MERCURY\n  * `7059` - 最新成交数量。以最新价格成交的数量\n  * `7068` - 买入交易所。显示提供 SMART 价格的交易所。A=AMEX, C=CBOE, I=ISE, X=PHLX, N=PSE, B=BOX, Q=NASDAQOM, Z=BATS, W=CBOE2, T=NASDAQBX, M=MIAX, H=GEMINI, E=EDGX, J=MERCURY\n  * `7084` - 隐含波动率/历史波动率 %。隐含波动率与历史波动率之比，以百分比表示。\n  * `7085` - 当日看跌期权未平仓合约总量与看涨期权未平仓合约之比。仅可用于标的。\n  * `7086` - 看跌/看涨成交量。当日看跌期权成交量/看涨期权成交量。\n  * `7087` - 历史波动率 %。30 天实时历史波动率。\n  * `7088` - 历史波动率收盘 %。显示基于前一收盘价的历史波动率。\n  * `7089` - 期权成交量。期权成交量\n  * `7094` - Conid + 交易所。\n  * `7184` - canBeTraded。合约是否为可交易标的。返回 1（true）或 0（false）。\n  * `7219` - 合约描述。\n  * `7220` - 合约描述。\n  * `7221` - 上市交易所。\n  * `7280` - 行业。显示标的公司可归类的行业类型。\n  * `7281` - 类别。显示标的公司在行业内可归类的更详细描述级别。\n  * `7282` - 平均成交量。90 天内的日均交易量。\n  * `7283` - 期权隐含波动率 %。对未来标的波动程度的预测。基于距当前交易日三十个日历日的到期所估计的市场波动率，并基于连续两个到期月份的期权价格。要查询特定行权价的隐含波动率 %，请参阅字段 7633。\n  * `7284` - 历史波动率 %。已弃用\n  * `7285` - 看跌/看涨比率。\n  * `7292` - 持仓成本。您在该证券中的当前持仓乘以平均价格与乘数。        \n  * `7293` - 52 周最高价。过去 52 周的最高价格。\n  * `7294` - 52 周最低价。过去 52 周的最低价格。\n  * `7295` - 开盘价。今日开盘价。\n  * `7296` - 收盘价。今日收盘价。\n  * `7308` - Delta。期权价格变动与标的价格相应变动之比。\n  * `7309` - Gamma。Delta 相对于标的价格的变化率。\n  * `7310` - Theta。衡量期权价值随时间流逝而下降的速率的指标。\n  * `7311` - Vega。波动率每变动 1% 时期权价格的变动量。\n  * `7607` - 期权成交量变化 %。今日期权成交量占平均期权成交量的百分比。\n  * `7633` - 隐含波动率 %。期权特定行权价的隐含波动率，以百分比表示。要从标的查询期权隐含波动率 %，请参阅字段 7283。\n  * `7635` - 标记价格。标记价格是\n  * `7636` - 可卖空股数。可供卖空的股票数量。\n  * `7637` - 费率。对借入股票收取的利率。\n  * `7638` - 期权未平仓合约。适用于标的及衍生品。\n  * `7639` - 占标记价值的百分比。显示合约市值占账户总市值的百分比。标记价值使用实时行情数据计算（即使未订阅行情数据）。\n  * `7644` - 可卖空。描述卖空该证券的难易程度。       \n  * `7671` - 股息。该值为未来十二个月每股预期股息支付总额。\n  * `7672` - 股息 TTM。该值为过去十二个月每股预期股息支付总额。\n  * `7674` - EMA(200)。指数移动平均线（N=200）。\n  * `7675` - EMA(100)。指数移动平均线（N=100）。\n  * `7676` - EMA(50)。指数移动平均线（N=50）。\n  * `7677` - EMA(20)。指数移动平均线（N=20）。\n  * `7678` - 价格/EMA(200)。价格与指数移动平均线（N=200）的比率 -1\n  * `7679` - 价格/EMA(100)。价格与指数移动平均线（N=100）的比率 -1\n  * `7724` - 价格/EMA(50)。价格与指数移动平均线（N=50）的比率 -1\n  * `7681` - 价格/EMA(20)。价格与指数移动平均线（N=20）的比率 -1\n  * `7682` - 自开盘以来涨跌。最新价与开盘价之差。\n  * `7683` - 即将到来的事件。显示下一个重大公司事件。需要 Wall Street Horizon 订阅。\n  * `7684` - 即将到来事件的日期。下一个重大公司事件的日期。需要 Wall Street Horizon 订阅。 \n  * `7685` - 即将到来的分析师会议。下一次安排的分析师会议的日期和时间。需要 Wall Street Horizon 订阅。\n  * `7686` - 即将到来的财报。下一次安排的财报/财报电话会议的日期和时间。需要 Wall Street Horizon 订阅。\n  * `7687` - 即将到来的其他事件。下一次股东大会的日期和时间\n  * `7688` - 最近的分析师会议。最近一次分析师会议的日期和时间。需要 Wall Street Horizon 订阅。\n  * `7689` - 最近的财报。最近一次财报/财报电话会议的日期和时间。需要 Wall Street Horizon 订阅。\n  * `7690` - 最近的其他事件。最近一次股东大会的日期和时间\n  * `7694` - 最大收益概率。客户隐含的最大潜在收益概率。\n  * `7695` - 盈亏平衡。盈亏平衡点\n  * `7696` - SPX Delta。贝塔加权 Delta 使用以下公式计算：Delta x 经美元调整的贝塔\n  * `7697` - 期货未平仓合约。未平仓期货合约总数\n  * `7698` - 最新收益率。若按当前最新价买入债券的隐含收益率。最新收益率使用所有可能的赎回日期上的最新价计算。假定若债券带有赎回或回售条款、且发行人能够基于当前市场利率提供更低的票息率，则会发生提前偿付。最差收益率将是到期收益率或赎回收益率中较低者（若债券带有提前偿付条款）。最差收益率可能与到期收益率相同，但绝不会更高。\n  * `7699` - 买入收益率。若按当前买入价买入债券的隐含收益率。买入收益率使用所有可能的赎回日期上的卖出价计算。假定若债券带有赎回或回售条款、且发行人能够基于当前市场利率提供更低的票息率，则会发生提前偿付。最差收益率将是到期收益率或赎回收益率中较低者（若债券带有提前偿付条款）。最差收益率可能与到期收益率相同，但绝不会更高。\n  * `7700` - 最大收益概率。客户隐含的最大潜在收益概率。\n  * `7702` - 最大亏损概率。客户隐含的最大潜在亏损概率。\n  * `7703` - 盈利概率。客户隐含的获得任何收益的概率。\n  * `7704` - 机构类型。\n  * `7705` - 债务类别。\n  * `7706` - 评级。为债券合约发布的评级。\n  * `7707` - 债券状态代码。\n  * `7708` - 债券类型。\n  * `7714` - 最后交易日。\n  * `7715` - 发行日期。\n  * `7720` - 卖出收益率。若按当前卖出价买入债券的隐含收益率。卖出收益率使用所有可能的赎回日期上的买入价计算。假定若债券带有赎回或回售条款、且发行人能够基于当前市场利率提供更低的票息率，则会发生提前偿付。最差收益率将是到期收益率或赎回收益率中较低者（若债券带有提前偿付条款）。最差收益率可能与到期收益率相同，但绝不会更高。\n  * `7741` - 前收盘价。昨日收盘价\n  * `7762` - 长精度成交量。当日高精度成交量。格式化成交量请参阅字段 87。\n  * `7768` - hasTradingPermissions。用户是否具有指定合约的交易权限。返回 1（true）或 0（false）。\n  * `7899` - 股票类型。确定股票类型。包括：Common, CORP, ADR, ETF, ETN, EFN, REIT, CEF, ETMF。\n  * `7920` - 原始日盈亏。自前一收盘以来当日的盈利或亏损。日盈亏使用实时行情数据计算（即使未订阅行情数据）。\n  * `7921` - 原始持仓成本。您在该证券中的当前持仓乘以平均价格与乘数。\n  * `7943` - 返还利率。联邦基金利率或其他相关货币的基准利率减去对借入股票收取的利率。\n"
      title: 行情字段
