  /v1/api/iserver/marketdata/history:
    get:
      operationId: tradingMarketData_getMdHistory
      summary: 历史 OHLC 柱线数据
      description: 以 OHLC 柱线的形式请求某个标的的历史数据。
      tags:
      - 行情数据
      parameters:
      - name: conid
        in: query
        description: 所请求标的的 IB 合约 ID。
        required: true
        schema:
          type: integer
          format: int64
      - name: period
        in: query
        description: "自 startTime 起向未来延伸、将被切分为指定宽度柱线的一段时间。支持的周期大小\n  * `min` - 分钟\n  * `h` - 小时\n  * `d` - 天\n  * `w` - 周\n  * `m` - 月\n  * `y` - 年\n"
        required: true
        schema:
          type: string
          default: 1d
      - name: bar
        in: query
        description: "由 period 和 startTime 确定的区间将被切分成的柱线宽度。不要求柱线恰好整除 period；可以返回不完整的柱线。支持的柱线大小\n  * `S` - 秒\n  * `min` - 分钟\n  * `h` - 小时\n  * `d` - 天\n  * `w` - 周\n  * `m` - 月\n"
        required: true
        schema:
          type: string
          default: 1min
      - name: exchange
        in: query
        description: 从中请求数据的交易所（或 SMART）。
        required: false
        schema:
          type: string
      - name: outsideRth
        in: query
        description: 指示响应中是否应包含常规交易时段以外的数据。
        required: false
        schema:
          type: boolean
          default: false
      - name: startTime
        in: query
        description: 历史数据请求的固定 UTC 日期时间参考点，指定的周期将自该点延伸。格式为 YYYYMMDD-hh:mm:ss。如果省略，则使用当前时间，且 direction 必须省略或为 1。
        required: false
        schema:
          $ref: '#/components/schemas/UTC日期时间'
      - name: direction
        in: query
        description: "指示数据应从起始时间开始还是结束于起始时间。\n  * `-1` - 历史数据将自起始时间偏移处开始，结束于当前时间/startTime。\n  * `1` - 历史数据从起始时间开始，向当前时间方向推进。仅在提供 startTime 时受支持。\n"
        required: false
        schema:
          $ref: '#/components/schemas/V1APIiServer行情数据历史Get参数方向'
          default: -1
      - name: source
        in: query
        description: "历史柱线中要返回的数据类型。支持的柱线大小\n  * `Bid_Ask` - 买价/卖价的 OHLC 值。\n  * `Last` - 成交价的 OHLC 值。\n  * `Midpoint` - 买卖价中点的 OHLC。\n"
        required: false
        schema:
          type: string
          default: Last
      responses:
        '200':
          description: 历史数据查询成功返回数据。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/交易行情数据_获取行情历史_响应_200'
        '400':
          description: 参数缺失、为空、非数字或超出范围。`error` 字段始终以 `Bad Request:` 为前缀。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '500':
          description: '内部服务器错误，在传入请求无法处理时返回。有时可能包含部分错误请求的情形。例如，传入了错误的 accountId，而只能在处理请求的后期才检测出来。错误中包含问题的原因。

