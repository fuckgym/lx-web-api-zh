  /v1/api/fa/model/invest-divest:
    post:
      operationId: tradingFaModelPortfolios_setAccountinvestmentInModel
      summary: 将账户投资于模型
      description: "为一个或多个账户提交针对 **单个** 目标模型的投资或撤资指令，并指定 **每账户** 的现金金额。`accountList` 中的每个条目将一个账户标识符与应用于该账户的单独 `amtToInvest` 值配对（正值表示投资，负值表示撤资）。\n\n约束条件以及与 `/fa/model/tws-invest-divest` 的对比：\n * 每个请求只能指定一个 **单一模型**（即顶层 `model`\n   字段）。若要在一次调用中投资多个模型，请使用\n   `/fa/model/tws-invest-divest` 及其 `modelList`。\n * 模型必须以 **单一货币** 计价；多币种\n   模型不受此端点支持。请使用 `/fa/model/tws-invest-divest`\n   来处理持有多种货币标的的模型。\n * 此处 **不支持 FA 交易前分配组**——每个账户\n   及其各自的投资金额必须显式列在\n   `accountList` 中。\n * 由于每个账户都是单独列出的，此端点允许\n   **每个账户有不同的投资金额**。相比之下，`/fa/model/tws-invest-divest`\n   会将单个 `amtToInvest` 在各账户间平均分摊，当使用\n   `group` 或 `accountList` 时。\n"
