  /v1/api/fa/model/tws-invest-divest:
    post:
      operationId: tradingFaModelPortfolios_twsInvestDivest
      summary: TWS 投资 / 撤资
      description: "针对一组账户，跨 **一个或多个目标模型** 提交 TWS 风格的投资或撤资指令。正的 `amtToInvest` 值会将现金投入目标模型；负值表示撤资。响应返回由此产生的分配计划，以及源现金池与每个目标模型之间的现金转账。\n\n要投资的账户集可以通过三种 **互斥** 方式之一来指定：\n * `account` - 单个 U 账户标识符\n   （例如 `\"account\": \"DU12349\"`）。\n * `accountList` - 显式的 U 账户标识符列表\n   （例如 `\"accountList\": [\"DU12349\", \"DU12350\", \"DU12351\"]`）。\n * `group` - FA 交易前分配组的名称\n   （例如 `\"group\": \"Group1\"`），或使用 `\"All\"` 包含顾问下的\n   每个账户。使用 `accountList` 或 `group` 时，每个 `amtToInvest` 值会被\n   **平均分摊** 到所解析出的各账户。\n\n\n与 `/fa/model/invest-divest` 的功能对比：\n * `tws-invest-divest` 支持以 **多种货币** 计价的模型；\n   `invest-divest` 仅支持单一货币模型。\n * `tws-invest-divest` 每个请求可接受 **多个目标模型**\n   （通过 `modelList`）；`invest-divest` 每个请求仅针对单个模型。\n * `invest-divest` 允许 **每个账户有不同的投资金额**，\n   因为每个账户都单独列出并带有各自的 `amtToInvest`。\n   `invest-divest` 不支持 FA 交易前分配组。\n * 当 `tws-invest-divest` 使用 `group` 或 `accountList` 时，单个\n   `amtToInvest` 会被 **平均** 分摊到所有解析出的账户。\n"
      tags:
      - FA 模型组合
      responses:
        '200':
          description: 成功计算投资/撤资分配计划。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TWS投资撤资响应'
        '401':
          description: 缺失、无效或无法解析的 Authorization 令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应'
        '500':
          description: '内部服务器错误，在传入请求无法处理时返回。有时可能包含部分错误请求的情形。例如，传入了错误的 accountId，而只能在处理请求的后期才检测出来。错误中包含问题的原因。

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/仅错误响应'
        '503':
          description: '服务不可用。例如，当由于某些内部服务不可用导致请求耗时超过 10 秒时，请求将被中止并返回此状态

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/错误响应_2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reqID:
                  type: integer
                  format: int64
                  description: 用于唯一跟踪请求的请求标识符。
                account:
                  type: string
                  description: '提交投资/撤资指令的单个 U 账户标识符。与 `accountList` 和 `group` 互斥。

                    '
                accountList:
                  type: array
                  items:
                    type: string
                  description: '要投资/撤资的 U 账户标识符的显式列表。`modelList` 中的每个 `amtToInvest` 值会在所列账户之间平均分摊。与 `account` 和 `group` 互斥。

                    '
                group:
                  type: string
                  description: '其成员账户应接收投资/撤资指令的 FA 交易前分配组的名称。使用 `"All"` 可指定顾问下的每个账户。提供该参数时，`modelList` 中的每个 `amtToInvest` 值会在解析出的组成员之间平均分摊。与 `account` 和 `accountList` 互斥。

                    '
                modelList:
                  type: array
                  items:
                    $ref: '#/components/schemas/V1APIFA模型TWS投资撤资Post请求体ContentApplicationJsonSchema模型列表项'
                  description: 投资/撤资指令的列表，每个目标模型一条。
                subscriptionKey:
                  type: string
                  description: 订阅密钥。初始请求时发送空字符串。
              required:
              - reqID
              - modelList
      security:
      - ssoBearer: []
