          description: '始终返回 HTTP 200。请检查 `success` 字段以确定结果。所有失败情形——身份验证、授权、校验以及内部错误——均返回 `success: false`。'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSV响应'
      requestBody:
        description: RS256 签名的 JWT（有效期：1 分钟），其载荷包含 `userName`、`requestId`、`payload`（Base64 编码的 CSV）以及可选的 `isEmpTrack`。`requestId` 必须与之前成功的 `/csv/v2/verify` 调用相匹配。与授权标头中的 JWT 不同。
