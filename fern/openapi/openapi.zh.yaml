      description: <ul><li>exchange-bundles - 查询用于 tradingPermissions 的最新 exchange-bundles 列表</li><li>business-and-occupation - 用于 employmentDetails 的 occupation 与 employerBusiness 列表</li><li>employee-track - 查询账户最新的 companyId。用于关联信息详情，前提是公司已拥有 IBKR Employee Track 账户</li><li>fin-info-ranges - 按货币查询 annualNetIncome、netWorth、liquidNetWorth 的最新范围 ID</li><li>acats - 查询 brokerId 与 brokerName 的最新取值。在通过美国 ACATS extPositionsTransfers 入金时使用</li><li>aton - 查询 brokerId 与 brokerName 的最新取值。在通过美国 ACATS extPositionsTransfers 入金时使用</li><li>market-data - 查询 brokerId 与 brokerName 的最新取值。在通过 ATON Canada extPositionsTransfers 入金时使用</li><li>edd-avt - 查询与分配给账户的 EDD（Enhanced Due Diligence）或 AVT（Additional Verification）任务相关的问题</li><li>prohibited-country - 查看禁止国家列表。居住在禁止国家的申请人被限制在 IBKR 开户。如果 legalResidenceCountry 或 country（包含于 Residence、mailingAddress 与 employerAddress、taxResidency 节点中）是禁止国家，将抛出错误</li><li>employee-plans - 查看与主账户关联的 EPA（适用于提供 SEP IRA 账户的情形）</li><li>questionnaires - 获取问卷列表</li><li>security-questions - 获取可用于 IBKR 安全问题的问题列表</li><li>quiz-questions - 获取与 IBKR 知识测评相关的问题列表</li><li>wire-instructions - 获取电汇指令列表</li><li>product-country-bundles - 获取产品国家组合列表</li><li>countries - 获取国家列表</li><li>states - 获取州列表</li><li>identification - 按国家获取所需身份证件目录（包括 MiFIR 规则）。传入 type=mifir 与一个或多个 citizenship 参数，可改为获取给定公民身份所需的 MiFIR 身份证件</li></ul>
      title: 枚举类型
